<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1d2433; --muted:#6b7385; --line:#e3e1da;
  --accent:#2f7d5b; --accent-weak:#dcefe5; --warn:#b4531a; --warn-weak:#fbe9dc; --empty:#ebe9e2;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14171c; --card:#1d2128; --ink:#e8eaee; --muted:#8c94a5; --line:#2c323c;
    --accent:#4fb383; --accent-weak:#1f3a2e; --warn:#e58a4d; --warn-weak:#3a2a1e; --empty:#2a2f38;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:20px 20px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
nav{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
nav button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:7px 14px;border-radius:7px;cursor:pointer}
nav button.on{background:var(--accent);color:#fff}
button{font:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.row{display:flex;align-items:center;gap:10px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--warn)}
.muted{color:var(--muted)}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.datebar h2{margin:0;font-size:18px}
.progress{height:10px;border-radius:99px;background:var(--empty);overflow:hidden;margin:6px 0 16px}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .2s}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;color:var(--ink)}
.item:hover{border-color:var(--accent)}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:15px;color:#fff;line-height:1}
.item.done{background:var(--accent-weak);border-color:var(--accent)}
.item.done .box{background:var(--accent);border-color:var(--accent)}
.item .name{font-weight:600;flex:1}
.item.done .name{text-decoration:line-through;text-decoration-color:var(--muted)}
.key{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.streak{font-size:12px;color:var(--muted)}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--ink);font:inherit;resize:vertical}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.tile .v{font-size:28px;font-weight:700;letter-spacing:-.02em}
.tile .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.bar{height:8px;border-radius:99px;background:var(--empty);min-width:90px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.scroll{overflow-x:auto}
.heat{display:grid;gap:3px;align-items:center}
.heat .lab{font-size:12px;color:var(--muted);padding-right:8px;white-space:nowrap;position:sticky;left:0;background:var(--card)}
.heat .c{width:16px;height:16px;border-radius:4px;background:var(--empty)}
.heat .c.d{background:var(--accent)}
.heat .h{font-size:10px;color:var(--muted);text-align:center}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px}
.bars i{flex:1;min-width:4px;background:var(--accent);border-radius:3px 3px 0 0;opacity:.9}
.bars i.z{background:var(--empty);height:3px!important}
h3{margin:0 0 10px;font-size:15px}
.seg{display:inline-flex;gap:4px}
.seg button{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:5px 11px;border-radius:7px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stack>*+*{margin-top:14px}
input[type=text],input[type=date]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--card);color:var(--ink)}
.banner{background:var(--warn-weak);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:.92}
